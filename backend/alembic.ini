# Alembic — TaxiHUB Fase 2 (Postgres dual)
# Un archivo genérico; la URL real viene de env DATABASE_URL en migrations/env.py

[alembic]
script_location = migrations
prepend_sys_path = .
version_locations = migrations/versions
sqlalchemy.url = postgresql+asyncpg://taxihub:taxihub_secret@postgres:5432/taxihub

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
