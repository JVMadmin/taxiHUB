services:
  mongo:
    image: mongo:7
    container_name: taxihub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taxihub_dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 15s
      retries: 5

  backend:
    build: ./backend
    container_name: taxihub-backend
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: taxihub_test
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/tests
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
    container_name: taxihub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  seed:
    image: curlimages/curl:8.6.0
    container_name: taxihub-seed
    depends_on:
      - backend
    command: >
      sh -c "
        until curl -sf http://backend:8000/api/ > /dev/null 2>&1; do sleep 2; done;
        echo 'Seeding...';
        curl -sf -X POST http://backend:8000/api/seed;
        echo;
        echo 'SEED_OK'
      "

volumes:
  mongo_data:
  uploads_data:
