name: taxihub-test

services:
  # --- Dual DB: Mongo se mantiene para transición (será removido en Fase 3) ---
  mongo:
    image: mongo:7
    container_name: taxihub-test-mongo
    ports:
      - "27018:27017" # Aislado: no colisiona con MongoDB estándar (27017)
    volumes:
      - mongo_data_test:/data/db
    environment:
      MONGO_INITDB_DATABASE: taxihub_dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Postgres 16 — infra Fase 2 (dual con Mongo). Cambiar a postgis/postgis:16-3.4
  # si se requiere GIS nativo (actualmente geo es haversine en Python + OSRM externo,
  # no se usa PostGIS; por eso se usa postgres:16-alpine liviano).
  postgres:
    image: postgres:16-alpine
    # Alternativa geo: image: postgis/postgis:16-3.4
    container_name: taxihub-test-postgres
    ports:
      - "5435:5432" # Aislado: 5432 (silkroad) y 5433 (rysa) ocupados; se usa 5435 libre
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: taxihub
      POSTGRES_USER: taxihub
      POSTGRES_PASSWORD: taxihub_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxihub -d taxihub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: taxihub-test-backend
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: taxihub_test
      DATABASE_URL: postgresql+asyncpg://taxihub:taxihub_secret@postgres:5432/taxihub
      CORS_ORIGINS: http://localhost:3080,http://localhost:8080,http://localhost:3000,http://localhost
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000" # Aislado: no colisiona con backend estándar (8000)
    volumes:
      - ./backend:/app
      - ./tests:/tests
      - uploads_data_test:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: taxihub-test-frontend
    ports:
      - "3080:80" # Aislado: no colisiona con frontend estándar (3000)
    depends_on:
      - backend

  seed:
    image: curlimages/curl:8.6.0
    container_name: taxihub-test-seed
    depends_on:
      - backend
    command: >
      sh -c "
        until curl -sf http://backend:8000/api/ > /dev/null 2>&1; do sleep 2; done;
        echo 'Poblando base de datos de prueba...';
        curl -sf -X POST http://backend:8000/api/seed;
        echo;
        echo 'SEED_OK'
      "

volumes:
  mongo_data_test:
  pg_data:
  uploads_data_test:
