name: taxihub

services:
  taxihub-mongo:
    image: mongo:7
    container_name: taxihub-mongo
    restart: unless-stopped
    volumes:
      - taxihub_mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  taxihub-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxihub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://taxihub-mongo:27017
      DB_NAME: taxihub_prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nexium-postgres:5432/${POSTGRES_DB}
      ENV: production
      CORS_ORIGINS: https://taxihub.cloud,https://www.taxihub.cloud
    volumes:
      - taxihub_uploads:/app/uploads
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/config/sitio || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      taxihub-mongo:
        condition: service_healthy

  taxihub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxihub-frontend
    restart: unless-stopped
    volumes:
      # APKs e instalador .exe: viven fuera de la imagen para que reconstruirla
      # nunca los borre (antes estaban dentro del contenedor).
      - taxihub_downloads:/usr/share/nginx/html/downloads
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      taxihub-backend:
        condition: service_healthy

# La siembra demo la hace el backend al arrancar (SIMULACION_DEMO=1 por defecto);
# el antiguo servicio taxihub-seed fallaba con 401 en producción.

volumes:
  taxihub_mongo_data:
  taxihub_uploads:
  taxihub_downloads:
    name: taxihub_downloads

networks:
  backend:
    external: true
  proxy:
    external: true
